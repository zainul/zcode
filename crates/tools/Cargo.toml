[package]
name = "tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../domain", version = "0.2.0" }
infra-shell = { path = "../infra/shell", version = "0.2.0" }
infra-filesystem = { path = "../infra/filesystem", version = "0.2.0" }
infra-config = { path = "../infra/config", version = "0.2.0" }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["mcp", "lsp"]
mcp = ["dep:infra-mcp"]
lsp = ["dep:infra-lsp"]

[dependencies.infra-mcp]
path = "../infra/mcp"
version = "0.2.0"
optional = true

[dependencies.infra-lsp]
path = "../infra/lsp"
version = "0.2.0"
optional = true

[dev-dependencies]
tempfile = "3.10"
