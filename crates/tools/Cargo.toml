[package]
name = "tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
infra-search = { path = "../infra/search", version = "0.7.1" }
domain = { path = "../domain", version = "0.7.1" }
infra-shell = { path = "../infra/shell", version = "0.7.1" }
infra-filesystem = { path = "../infra/filesystem", version = "0.7.1" }
infra-config = { path = "../infra/config", version = "0.7.1" }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["mcp", "lsp"]
mcp = ["dep:infra-mcp"]
lsp = ["dep:infra-lsp"]

[dependencies.infra-mcp]
path = "../infra/mcp"
version = "0.7.1"
optional = true

[dependencies.infra-lsp]
path = "../infra/lsp"
version = "0.7.1"
optional = true

[dev-dependencies]
tempfile = "3.10"
# The index tools are tested against the real index; the dependency is a
# test-only one, so `tools` itself still reaches the index through the port.
infra-index = { path = "../infra/index" }
