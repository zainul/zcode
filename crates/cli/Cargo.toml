[package]
name = "zcode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../domain", version = "0.3.0" }
app = { path = "../app", version = "0.3.0" }
infra-llm = { path = "../infra/llm", version = "0.3.0" }
infra-filesystem = { path = "../infra/filesystem", version = "0.3.0" }
infra-shell = { path = "../infra/shell", version = "0.3.0" }
infra-config = { path = "../infra/config", version = "0.3.0" }
infra-session = { path = "../infra/session", version = "0.3.0" }
infra-telemetry = { path = "../infra/telemetry", version = "0.3.0" }
tools = { path = "../tools", version = "0.3.0", default-features = false }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
ratatui = { workspace = true }
uuid = { workspace = true }
signal-hook = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["mcp", "lsp"]
# Forwarded to `tools`, which owns the optional adapters. Building with
# --no-default-features drops the MCP and LSP clients from the binary.
mcp = ["tools/mcp"]
lsp = ["tools/lsp"]
pty = ["infra-shell/pty"]

[build-dependencies]
# Build script embeds the git SHA + profile; no external build deps.
