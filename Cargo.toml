[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/app",
    "crates/infra/llm",
    "crates/infra/filesystem",
    "crates/infra/shell",
    "crates/infra/config",
    "crates/cli",
    "benches",
]
exclude = ["target"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qagent/ag"

[workspace.dependencies]
tokio = { version = "1.39", default-features = false, features = ["rt", "macros"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "dev"
opt-level = 0
