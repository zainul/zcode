[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/app",
    "crates/tools",
    "crates/infra/llm",
    "crates/infra/filesystem",
    "crates/infra/shell",
    "crates/infra/config",
    "crates/infra/mcp",
    "crates/infra/lsp",
    "crates/infra/session",
    "crates/infra/telemetry",
    "crates/cli",
    "benches",
]
exclude = ["target"]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zainul/zcode"

[workspace.dependencies]
# Pinned for a future async surface; nothing depends on it today — the agent
# runs on std threads so there is no runtime to pay for (see crates/cli/src/main.rs).
tokio = { version = "1.39", default-features = false, features = ["rt", "macros"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.10", features = ["v7"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
lsp-types = "0.97"
ratatui = "0.29"
crossterm = "0.28"
regex = "1.10"
signal-hook = "0.3"
tempfile = "3.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "dev"
opt-level = 0
