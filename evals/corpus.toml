grader = { kind = "command", script = "go-add-test.sh" }

[[task]]
id = "go-long"
repo = "go-service"
category = "long-horizon"
prompt = "Add order cancellation: a `StatusCancelled` status, `Service.Cancel(id string) (Order, error)` that refuses to cancel a shipped order (return an exported ErrAlreadyShipped), and an HTTP endpoint `POST /orders/{id}/cancel` returning 200 with the order, 404 for an unknown id and 409 for a shipped order. Add tests for the service and the endpoint."
max_turns = 120
timeout_s = 1800
grader = { kind = "command", script = "go-long.sh" }

