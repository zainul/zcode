  "Mentions Handler.ServeHTTP / create in internal/httpapi/handler.go",
  "Mentions Service.Create in internal/orders/service.go",
  "Mentions the Store's Put (MemoryStore.Put in internal/orders/store.go)",
] }

[[task]]
id = "go-fix"
repo = "go-service"
category = "single-file-fix"
prompt = "`go test ./...` fails in internal/orders (TestTotalAppliesDiscountOnce). Fix the bug without changing the test."
