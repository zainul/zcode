# Evaluation corpus (PRD-CTX-EFF-003 §10.1): 4 repositories × 6 categories.
# Graders live in graders/ and run in the post-run working tree (exit 0 = pass).

# ---------------------------------------------------------------- self-test
# Deterministic: replayed from replay/selftest, graded without a model.
[[task]]
id = "selftest"
repo = "selftest-lib"
category = "locate-and-explain"
mode = "planning"
prompt = "Which function computes the arithmetic mean, and in which file is it?"
max_turns = 5
grader = { kind = "contains", all = ["mean", "pylib/stats.py"] }

# ---------------------------------------------------------------- zcode (Rust)
[[task]]
id = "rust-locate"
repo = "zcode"
category = "locate-and-explain"
mode = "planning"
prompt = "Where is the system prompt for an agent mode chosen, and what happens to the system message when an existing session is resumed?"
grader = { kind = "rubric", criteria = [
  "Names `system_prompt` in crates/domain/src/modes.rs (or domain::modes::system_prompt) as where the prompt is chosen per mode",
  "Says that on resume the first history message is replaced when it is a system message, or a system message is inserted when there is none",
] }

[[task]]
id = "rust-fix"
repo = "zcode"
category = "single-file-fix"
prompt = "The test `domain::naming::tests::maps_prd_spellings_to_wire_names` fails. Find the bug and fix it. Do not change the test."
max_turns = 30
grader = { kind = "command", script = "rust-fix.sh" }

[[task]]
id = "rust-refactor"
repo = "zcode"
category = "multi-file-refactor"
prompt = "Replace the free function `reason_str` in crates/app/src/lib.rs with a public method `LlmFinishReason::as_str(self) -> &'static str` defined in the domain crate, and use it everywhere `reason_str` was used. Keep behaviour identical."
max_turns = 40
grader = { kind = "command", script = "rust-refactor.sh" }

[[task]]
id = "rust-rename"
repo = "zcode"
category = "rename"
prompt = "Rename the function `truncate_tool_output` to `cap_tool_output` everywhere in the workspace, including tests and doc comments."
max_turns = 30
grader = { kind = "command", script = "rust-rename.sh" }

[[task]]
id = "rust-add-test"
repo = "zcode"
category = "add-test"
prompt = "Add a unit test to crates/domain/src/model_id.rs covering a model id that has both a vendor namespace and a routing suffix (e.g. `openrouter/anthropic/claude-3.5-haiku:beta`). The test must pass."
max_turns = 30
grader = { kind = "command", script = "rust-add-test.sh" }

[[task]]
id = "rust-long"
repo = "zcode"
category = "long-horizon"
prompt = "Add a `/version` slash command to the TUI that prints zcode's build version as a note. Follow the existing slash-command pattern in crates/cli/src/cli/tui/command.rs (parsing, help text, handling) and add parser tests for `/version` next to the existing ones. `cargo test -p zcode` must pass."
max_turns = 120
timeout_s = 1800
grader = { kind = "command", script = "rust-long.sh" }

# ---------------------------------------------------------------- go-service
